name: check

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repository checks
        run: node scripts/check.mjs

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Production dependencies only: the tests use a fake Claude Code, not the pinned one (a large binary).
      - name: Install the pinned rea package
        run: npm ci --ignore-scripts --omit=dev
      - name: Benchmark unit tests (graders, rea adapter, statistics)
        run: npm run bench:test
